name: Refresh DB Schemas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-db-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure workflow runs from a branch ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Refresh DB Schemas must run from a branch ref. Current ref type: ${GITHUB_REF_TYPE}"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_ACTIONS_PAT }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate DB schemas
        run: pnpm db:schemas:generate
      - name: Commit refreshed DB schemas
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --short -- packages/infra/db/schemas)" ]]; then
            echo "No generated schema changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/infra/db/schemas
          git commit -m "chore(db): refresh generated schemas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
