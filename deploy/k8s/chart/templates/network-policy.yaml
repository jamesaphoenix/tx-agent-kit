{{- if .Values.networkPolicy.enabled }}
{{- if .Values.otelCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tx-agent-kit.fullname" . }}-otel-collector
  labels:
    {{- include "tx-agent-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tx-agent-kit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: {{ .Values.otelCollector.service.port }}
        - protocol: TCP
          port: 13133
        - protocol: TCP
          port: 8888
{{- end }}
{{- end }}
