name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

# Slot-scoped values (API_PORT, DATABASE_URL, DATABASE_SCHEMA,
# WORKTREE_PORT_OFFSET, API_CORS_ORIGIN, WEB_BASE_URL, GOOGLE_OIDC_CALLBACK_URL,
# TEMPORAL_TASK_QUEUE, and the e2e WEB_PORT) are deliberately NOT declared here.
# They depend on which of the four Mac Studio runners picked up the job, so the
# "Resolve runner slot" step emits them via $GITHUB_ENV
# (scripts/deploy/ci/resolve-runner-slot.sh). Re-declaring any of them in YAML
# would shadow the slot values and collide concurrent runners (this repo AND
# its sibling repos share the same four runners + Docker infra).
env:
  NODE_ENV: test
  API_HOST: '127.0.0.1'
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-integration-auth-secret-${{ github.run_id }}-${{ github.run_attempt }}
  AUTH_RATE_LIMIT_WINDOW_MS: '60000'
  AUTH_RATE_LIMIT_MAX_REQUESTS: '100'
  AUTH_RATE_LIMIT_IDENTIFIER_MAX_REQUESTS: '100'
  # Empty disables the rate-limit bypass (fails closed); CI keeps loose limits above.
  AUTH_RATE_LIMIT_BYPASS_TOKEN: ''
  # Empty secret disables Turnstile so factory sign-ups need no captcha token.
  TURNSTILE_SECRET_KEY: ''
  TURNSTILE_VERIFY_URL: ''
  RESEND_API_KEY: ''
  RESEND_FROM_EMAIL: ''
  RESEND_WEBHOOK_SECRET: ''
  # Auto-fix new-issue webhook: the spawned API actually receives these from the
  # vitest global setup (stub trigger + fixed HMAC secret); declared here too so
  # the contract is explicit in CI.
  SENTRY_WEBHOOK_SECRET: 'test-sentry-webhook-secret-for-integration'
  SENTRY_DEPLOYMENT_ENVIRONMENT: staging
  AUTO_FIX_TRIGGER_MODE: stub
  # API-side Temporal client config. The auto-fix webhook integration test runs
  # the trigger in stub mode (above), so the API never connects to Temporal in
  # CI; these are declared (empty/default) to satisfy the CI env contract.
  TEMPORAL_RUNTIME_MODE: cli
  TEMPORAL_ADDRESS: localhost:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_API_KEY: ''
  TEMPORAL_TLS_ENABLED: 'false'
  TEMPORAL_TLS_SERVER_NAME: ''
  TEMPORAL_TLS_CA_CERT_PEM: ''
  TEMPORAL_TLS_CLIENT_CERT_PEM: ''
  TEMPORAL_TLS_CLIENT_KEY_PEM: ''
  GOOGLE_OIDC_ISSUER_URL: http://localhost:65535
  GOOGLE_OIDC_CLIENT_ID: ci-google-client-id
  GOOGLE_OIDC_CLIENT_SECRET: ci-google-client-secret
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''
  STRIPE_TRY_ME_PRICE_ID: ''
  STRIPE_TRY_ME_METERED_PRICE_ID: ''
  STRIPE_PRO_PRICE_ID: ''
  STRIPE_PRO_METERED_PRICE_ID: ''
  STRIPE_AGENCY_PRICE_ID: ''
  STRIPE_AGENCY_METERED_PRICE_ID: ''
  SUBSCRIPTION_GUARD_ENABLED: 'true'
  TRUST_PROXY: 'false'
  API_SENTRY_DSN: ''
  SENTRY_SPOTLIGHT: 'false'
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

jobs:
  integration:
    name: Run All Integration Suites
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 90
    env:
      WORKTREE_SETUP_BATCH_MAX_LATENCY_MS: '60000'
      # Cap web-integration parallelism on the shared self-hosted runner: the
      # full web suite's peak parallel-render load can starve fragile secondary
      # queries / async component state under contention. CI-only; the robust
      # assertions are the primary guard, this is belt-and-suspenders.
      WEB_INTEGRATION_MAX_WORKERS: '2'
      # Cap api-integration parallelism: with four runner slots this job can run
      # 4x concurrently on the shared 16-core Studio (which also hosts the
      # prod/staging stacks). The local default of min(CPU, 6) is tuned for one
      # job per machine.
      INTEGRATION_MAX_WORKERS: '3'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Resolve runner slot
        run: ./scripts/deploy/ci/resolve-runner-slot.sh integration
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated DB schemas are current
        run: |
          pnpm db:schemas:generate
          if [[ -n "$(git status --short -- packages/infra/db/schemas)" ]]; then
            echo "Generated DB schemas are stale. Run pnpm db:schemas:generate and commit the result."
            git status --short -- packages/infra/db/schemas
            git diff -- packages/infra/db/schemas
            exit 1
          fi
      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/**'
      - name: Configure local env files
        run: pnpm env:configure
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | TEMPORAL_CLI_VERSION=1.1.2 sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Setup Docker config
        run: ./scripts/deploy/ci/setup-mac-docker-config.sh
      - name: Ensure infrastructure
        run: pnpm infra:ensure
      - name: Run integration suites
        run: pnpm test:integration:quiet
      - name: Run pgTAP tests
        run: pnpm test:db:pgtap
      - name: Run Temporal integration suite
        run: pnpm test:temporal:integration
      - name: Cleanup runner slot
        if: always()
        run: |
          if [[ -x scripts/deploy/ci/cleanup-runner-slot.sh ]]; then
            ./scripts/deploy/ci/cleanup-runner-slot.sh
          fi

  e2e:
    name: Web E2E (browser)
    runs-on: [self-hosted, mac-studio]
    # The Playwright TEST RUN is hard-capped at 120s by globalTimeout in
    # apps/web/e2e/playwright.config.ts AND by the portable process-kill wrapper
    # in the test:e2e script. The production BUILD is a SEPARATE prerequisite
    # step (`Build web (production)`) and is NOT counted against that 120s
    # budget. This job-level ceiling covers build + serve + the bounded test
    # step; it is generous on purpose (a real `next build` runs here) — the
    # un-widenable 120s budget that enforce-e2e-budget.mjs guards binds the TEST
    # RUN, not this job. The dedicated test step below carries its own
    # `timeout-minutes: 2` so the bounded run cannot drag on.
    timeout-minutes: 15
    # WEB_PORT / API_PORT and every URL derived from them (e2e bases 3510/4510
    # plus the slot offset) come from the "Resolve runner slot" step below, NOT
    # from YAML env - see the note above the workflow env block. The pre-slot
    # WEB_PORT 3000 base would land slot 1/2 on the Studio's AirPlay ports.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Resolve runner slot
        run: ./scripts/deploy/ci/resolve-runner-slot.sh e2e
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: pnpm --filter @tx-agent-kit/web exec playwright install --with-deps chromium
      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/**'
      - name: Configure local env files
        run: pnpm env:configure
      - name: Setup Docker config
        run: ./scripts/deploy/ci/setup-mac-docker-config.sh
      - name: Ensure infrastructure
        run: pnpm infra:ensure
      # Migrate + reset this slot's schema (DATABASE_SCHEMA/DATABASE_URL from the
      # slot step) so the api below starts against a current, clean schema.
      # Unlike the integration job, nothing else in this job runs migrations.
      # reset-test-db.sh serializes on the shared db-reset lock and creates the
      # slot schema before migrating.
      - name: Prepare slot database schema
        run: TX_AGENT_SKIP_INFRA_ENSURE=1 ./scripts/test/reset-test-db.sh
      # PREREQUISITE (not in the 120s test budget): produce the Next.js prod
      # build the E2E suite serves. Lazy-compiled dev bundles are the typical
      # first-attempt flake; the prod build has no lazy compile.
      - name: Build web (production)
        run: pnpm --filter @tx-agent-kit/web run e2e:build
      # Start the api and the prebuilt prod web server, then poll BOTH for a 200
      # before the bounded test step. Playwright's webServer block also reuses
      # this already-running prod web server.
      - name: Start api
        run: |
          log_file="${RUNNER_TEMP}/e2e-api.log"
          echo "API log: ${log_file}"
          pnpm --filter @tx-agent-kit/api dev >"${log_file}" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/e2e-api.pid"
      - name: Start web (production server)
        run: |
          log_file="${RUNNER_TEMP}/e2e-web.log"
          echo "Web log: ${log_file}"
          ./scripts/dev/kill-stale-service.sh web
          pnpm --filter @tx-agent-kit/web run e2e:serve >"${log_file}" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/e2e-web.pid"
      - name: Wait for api + web readiness
        run: |
          api_port="${API_PORT:-4000}"
          web_port="${WEB_PORT:-3000}"
          dump_service_logs() {
            echo "::group::E2E API log"
            tail -n 200 "${RUNNER_TEMP}/e2e-api.log" || true
            echo "::endgroup::"
            echo "::group::E2E web log"
            tail -n 200 "${RUNNER_TEMP}/e2e-web.log" || true
            echo "::endgroup::"
            echo "::group::E2E port listeners"
            lsof -nP -iTCP:"${api_port}" -sTCP:LISTEN || true
            lsof -nP -iTCP:"${web_port}" -sTCP:LISTEN || true
            echo "::endgroup::"
          }
          poll() {
            local name="$1" url="$2"
            for i in $(seq 1 120); do
              if curl -fsS -o /dev/null "$url"; then
                echo "$name ready after ${i}s ($url)"
                return 0
              fi
              sleep 1
            done
            echo "$name did NOT become ready at $url within 120s" >&2
            dump_service_logs
            return 1
          }
          poll api "http://localhost:${api_port}/health"
          poll web "http://localhost:${web_port}/"
      # The BOUNDED test run — the only step the 120s budget binds. Its own
      # timeout-minutes:2 is the CI backstop for the test-run wall-clock.
      - name: Run Web E2E suite
        timeout-minutes: 2
        run: pnpm --filter @tx-agent-kit/web run test:e2e
      - name: Cleanup runner slot
        if: always()
        run: |
          if [[ -x scripts/deploy/ci/cleanup-runner-slot.sh ]]; then
            ./scripts/deploy/ci/cleanup-runner-slot.sh
          fi
